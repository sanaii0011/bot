<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارهای فعال من - تودولیست</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f6f8);
      --text-color: var(--tg-theme-text-color, #222222);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #999999);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      direction: rtl;
    }

    .header {
      text-align: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .header h2 {
      margin: 0 0 6px 0;
      font-size: 1.4em;
    }

    .header p {
      margin: 0;
      font-size: 0.95em;
      color: var(--hint-color);
    }

    /* استایل کارت‌های وظایف */
    .task-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-right: 4px solid var(--button-color);
    }

    .task-card:active {
      transform: scale(0.98);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-title {
      font-weight: 700;
      font-size: 1.1em;
    }

    .task-meta {
      font-size: 0.85em;
      color: var(--hint-color);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* حالت لودینگ و حالت خالی */
    .state-box {
      text-align: center;
      margin-top: 50px;
      color: var(--hint-color);
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 3px solid var(--hint-color);
      border-top: 3px solid var(--button-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* دکمه به‌روزرسانی */
    .action-btn {
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.95em;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>📋 کارهای فعال من</h2>
    <p id="user-greeting">در حال اتصال به تلگرام...</p>
  </div>

  <div id="tasks-container">
    <div class="state-box">
      <div class="spinner"></div>
      <p>در حال دریافت اطلاعات از دیتابیس...</p>
    </div>
  </div>

  <button class="action-btn" onclick="loadTasks()">🔄 به‌روزرسانی لیست</button>

  <script>
    // 🔗 آدرس سرور رندر خودتان را در متغیر زیر جایگزین کنید:
    const RENDER_SERVER_URL = "https://your-bot-name.onrender.com"; 

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // دریافت اطلاعات کاربر تلگرام
    const user = tg.initDataUnsafe?.user;
    const userName = user ? user.first_name : "کاربر عزیز";
    const userId = user ? user.id : null;

    document.getElementById('user-greeting').innerText = `سلام ${userName} 👋`;

    // تابع دریافت کارهای زنده از سرور Render
    async function loadTasks() {
      const container = document.getElementById('tasks-container');
      
      container.innerHTML = `
        <div class="state-box">
          <div class="spinner"></div>
          <p>در حال بارگذاری کارهای زنده شما...</p>
        </div>
      `;

      if (!userId) {
        container.innerHTML = `
          <div class="state-box">
            <p style="color: #ff9800;">⚠️ شناسه کاربر یافت نشد. لطفاً وب‌اپ را درون تلگرام باز کنید.</p>
          </div>
        `;
        return;
      }

      try {
        const response = await fetch(`${RENDER_SERVER_URL}/api/tasks?user_id=${userId}`);
        
        if (!response.ok) {
          throw new Error(`خطای سرور: ${response.status}`);
        }

        const data = await response.json();

        if (data.status !== "success" || !data.tasks || data.tasks.length === 0) {
          container.innerHTML = `
            <div class="state-box">
              <p>🎉 هیچ کار فعالی در لیست شما نیست!</p>
            </div>
          `;
          return;
        }

        const priMap = { "High": "🚨 ضروری", "Medium": "🟡 معمولی", "Low": "🟢 کم‌اهمیت" };
        const catMap = { "Personal": "👤 شخصی", "Work": "💼 کاری", "Study": "📚 تحصیلی" };

        let htmlContent = '';
        data.tasks.forEach(task => {
          htmlContent += `
            <div class="task-card">
              <div class="task-header">
                <span class="task-title">🔹 ${task.title}</span>
              </div>
              ${task.description ? `<p style="margin: 4px 0; font-size: 0.9em; color: var(--hint-color);">${task.description}</p>` : ''}
              <div class="task-meta">
                <span>📁 ${catMap[task.category] || task.category}</span>
                <span>⭐ ${priMap[task.priority] || task.priority}</span>
                ${task.due_date ? `<span>⏰ ${task.due_date}</span>` : ''}
              </div>
            </div>
          `;
        });

        container.innerHTML = htmlContent;

      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="state-box">
            <p style="color: #ff5252;">⚠️ خطا در دریافت اطلاعات از سرور Render.</p>
          </div>
        `;
      }
    }

    // اجرای اولیه بارگذاری
    loadTasks();
  </script>
</body>
</html>
