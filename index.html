<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارهای فعال من - تودولیست</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f6f8);
      --text-color: var(--tg-theme-text-color, #222222);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #999999);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      direction: rtl;
    }

    .header {
      text-align: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--hint-color);
    }

    .header h2 {
      margin: 0 0 6px 0;
      font-size: 1.4em;
    }

    .header p {
      margin: 0;
      font-size: 0.95em;
      color: var(--hint-color);
    }

    /* استایل کارت‌های وظایف */
    .task-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-right: 4px solid var(--button-color);
    }

    .task-card:active {
      transform: scale(0.98);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-title {
      font-weight: 700;
      font-size: 1.1em;
    }

    .task-meta {
      font-size: 0.85em;
      color: var(--hint-color);
      display: flex;
      gap: 12px;
    }

    /* حالت لودینگ و حالت خالی */
    .state-box {
      text-align: center;
      margin-top: 50px;
      color: var(--hint-color);
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 3px solid var(--hint-color);
      border-top: 3px solid var(--button-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* دکمه رفرش یا عملیات سریع */
    .action-btn {
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.95em;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>📋 کارهای فعال من</h2>
    <p id="user-greeting">در حال اتصال به تلگرام...</p>
  </div>

  <div id="tasks-container">
    <div class="state-box">
      <div class="spinner"></div>
      <p>در حال دریافت اطلاعات از دیتابیس...</p>
    </div>
  </div>

  <button class="action-btn" onclick="loadTasks()">🔄 به‌روزرسانی لیست</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // دریافت اطلاعات کاربر
    const user = tg.initDataUnsafe?.user;
    const userName = user ? user.first_name : "کاربر عزیز";
    const userId = user ? user.id : null;

    document.getElementById('user-greeting').innerText = `سلام ${userName} 👋`;

    // تابع اصلی برای بارگذاری کارها
    async function loadTasks() {
      const container = document.getElementById('tasks-container');
      
      // نمایش حالت لودینگ
      container.innerHTML = `
        <div class="state-box">
          <div class="spinner"></div>
          <p>در حال بارگذاری کارها...</p>
        </div>
      `;

      try {
        // اینجا در مراحل بعدی آدرس سرور Render خودتان را قرار خواهید داد
        // مثلاً: const response = await fetch(`https://your-app.onrender.com/api/tasks?user_id=${userId}`);
        // const tasks = await response.json();

        // فعلاً برای تست ظاهر خفن کد، چند نمونه کار شبیه‌سازی شده نمایش می‌دهیم:
        await new Promise(resolve => setTimeout(resolve, 800)); // شبیه‌سازی تاخیر شبکه
        
        const mockTasks = [
          { id: 1, title: "🚀 تکمیل پروژه وب‌اپ تلگرام", category: "شخصی", priority: "زیاد" },
          { id: 2, title: "📚 مطالعه مستندات پایتون و ربات", category: "تحصیلی", priority: "متوسط" }
        ];

        if (mockTasks.length === 0) {
          container.innerHTML = `
            <div class="state-box">
              <p>🎉 هیچ کار فعالی در لیست شما نیست!</p>
            </div>
          `;
          return;
        }

        // رندر کردن کارت‌ها روی صفحه
        let htmlContent = '';
        mockTasks.forEach(task => {
          htmlContent += `
            <div class="task-card">
              <div class="task-header">
                <span class="task-title">🔹 ${task.title}</span>
              </div>
              <div class="task-meta">
                <span>📁 دسته: ${task.category}</span>
                <span>⭐ اولویت: ${task.priority}</span>
              </div>
            </div>
          `;
        });

        container.innerHTML = htmlContent;

      } catch (error) {
        container.innerHTML = `
          <div class="state-box">
            <p style="color: #ff5252;">⚠️ خطا در دریافت اطلاعات از سرور.</p>
          </div>
        `;
      }
    }

    // اجرای اولیه بارگذاری کارها هنگام باز شدن صفحه
    loadTasks();
  </script>
</body>
</html>
