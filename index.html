<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تودولیست من</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
      margin: 0;
      padding: 16px;
      direction: rtl;
    }
    .header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--tg-theme-secondary-bg-color, #eee);
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .task-title {
      font-weight: bold;
      font-size: 1.1em;
      color: var(--tg-theme-button-color, #2481cc);
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>📋 کارهای فعال من</h2>
    <p id="user-greeting">در حال دریافت اطلاعات...</p>
  </div>

  <div id="tasks-list">
    <div class="card">
      <div class="task-title">💡 وضعیت سیستم</div>
      <p>وب‌اپ تودولیست شما با موفقیت به تلگرام متصل شد.</p>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user-greeting').innerText = `سلام ${user.first_name} عزیز 👋`;
    } else {
      document.getElementById('user-greeting').innerText = `لطفاً وب‌اپ را از داخل تلگرام باز کنید.`;
    }
  </script>
</body>
</html>
